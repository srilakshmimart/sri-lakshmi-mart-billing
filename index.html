<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Sri Lakshmi Mart Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7A263A">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="app">
  <aside class="rail" id="rail" aria-label="Admin sections"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <h1 id="pageTitle">Dashboard</h1>

      <div class="top-right">
        <div class="notif-wrap">
          <button class="icon-btn" id="notifBtn" aria-label="Notifications" aria-expanded="false">
            <i class="bi bi-bell"></i>
            <span class="badge-dot" id="notifDot" style="display:none">0</span>
          </button>
          <div class="notif-panel" id="notifPanel">
            <h3>Notifications</h3>
            <div class="notif-list" id="notifList"></div>
          </div>
        </div>

        <div class="prof-wrap">
          <button class="prof-btn" id="profileBtn" aria-label="Account menu" aria-expanded="false">
            <span class="avatar" id="topAvatar">A</span>
            <span class="prof-text">
              <b id="topName">—</b>
              <small id="topRole">—</small>
            </span>
            <i class="bi bi-chevron-down" style="font-size:.7rem"></i>
          </button>
          <div class="prof-menu">
            <a href="#/settings"><i class="bi bi-person"></i> Profile</a>
            <a href="#/settings"><i class="bi bi-gear"></i> Settings</a>
            <button id="menuLogout"><i class="bi bi-box-arrow-right"></i> Log out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/demo-catalogue.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/core.js"></script>
<script src="js/charts.js"></script>
<script src="js/router.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/orders.js"></script>
<script src="js/pages/bills.js"></script>
<script src="js/pages/customers.js"></script>
<script src="js/pages/catalogue.js"></script>
<script src="js/pages/insights.js"></script>
<script src="js/pages/manage.js"></script>
<script>
(async function () {
  SB.init();
  const profile = await Auth.requireAuth();
  if (!profile) return;                 // requireAuth already redirected
  Shell.mount();
  Shell.setProfile(profile);
  document.getElementById('menuLogout')
    .addEventListener('click', () => Auth.signOut());
  addEventListener('hashchange', Shell.render);
  await Shell.render();
})();
</script>
</body>
</html>
